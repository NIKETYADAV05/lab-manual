{% extends 'blog/base.html' %}

{% block title %}Log In{% endblock %}

{% block content %}
<section class="form-card">
    <h1>Log In</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        {% if next %}
        <input type="hidden" name="next" value="{{ next }}">
        {% endif %}
        <button type="submit">Log In</button>
    </form>
</section>
{% endblock %}
